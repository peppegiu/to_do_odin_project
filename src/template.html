<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-do</title>
  </head>

  <body>
    <nav class="nav-list">
      <div class="addtodo-div">
        <button class="addtodo-button" hidden>
          <img src="./images/add.svg" alt="add button" />
        </button>
        <p>Add task</p>
      </div>
      <div class="addproject-div">
        <button class="addproject-button">Create Project</button>
        <p>Create Project</p>
      </div>
    </nav>
    <main class="project-view">
      <p>No project selected</p>
      <dialog class="project-todo-form">
        <form id="project-todo-form" action="">
          <p>
            <label for="">Create a Todo!</label>
          </p>
          <p class="todo-title">
            <label class="todo-title" for="">Title:</label>
            <input
              id="todo-title-input"
              class="todo-title"
              type="text"
              name="todo-title"
            />
          </p>
          <p class="todo-description">
            <label for="" class="todo-description"></label>
            <textarea
              name="todo-description"
              id="todo-description-input"
            ></textarea>
          </p>
          <p class="todo-duedate">
            <label for="" class="duedate">Due date</label>
            <input class="todo-date" type="date" name="todo-date" />
          </p>
          <p class="todo-priority">
            <label for="" class="priority"
              >Set the priority of your project:</label
            >
            <input
              class="todo-priority"
              type="number"
              name="todo-priority"
              id=""
              min="1"
              max="5"
            />
          </p>
          <p class="notes">
            <label for="" class="notes">Notes or hashtags</label>
            <textarea
              class="todo-notes-input"
              name="todo-notes"
              id="todo-notes-input"
            ></textarea>
          </p>

          <button class="todo-form-submit" type="submit" name="" id="">
            Submit
          </button>
        </form>
      </dialog>
      <dialog class="todo-inspector-dialog">
        <form action="" id="todo-inspector">
          <button type="submit" class="close"></button>
          <div class="inspector-checkmark">
            <input name="todo-inspector-checkmark" class="todo-inspector-checkmark" type="checkmark" />
            <label for="inspector-priority">Priority: </label>
            <input
              class="inspector-priority"
              name="inspector-priority"
              type="number"
              min="1"
              max="5"
            />
          </div>
          <div class="inspector-todo-content">
            <input name="inspector-title" class="inspector-title" type="text" />
            <textarea class="inspector-description" name="inspector-description" id=""></textarea>
            <div class="inspector-subtasks"></div>
          </div>
        </form>
      </dialog>
      <dialog class="project-form">
        <form action="" id="project-form">
          <p>
            <label for="project-form-name">Project name:</label>
            <input
              class="project-form-name"
              name="project-form-name"
              type="text"
            />
            <button type="submit">submit</button>
          </p>
        </form>
      </dialog>
      <script type="module" src="index.js"></script>
    </main>
  </body>
</html>
